# Alembic configuration for the Zoiko Assure schema (docs/database-migrations.md).
#
# Apply, verify and inspect migrations with the project tool, not the raw `alembic` command:
#     python -m app.migrate status | upgrade | check
# The tool validates an existing database before it records a version, holds the migration lock and runs everything in
# one transaction. migrations/env.py therefore refuses `alembic upgrade`, `downgrade` and `stamp`; the authoring and
# read-only commands (`alembic revision --autogenerate`, `check`, `history`, `heads`, `current`) remain available.
#
# The database URL comes from the backend configuration (DATABASE_ADMIN_URL, the owner/migration role), never from
# this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
