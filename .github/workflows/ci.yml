# Zoiko Assure CI. Documented in docs/ci-cd.md.
#
#   frontend          npm ci -> tsc --noEmit -> next build                 (public NEXT_PUBLIC_* config only)
#   backend-unit      pip install -> pip check -> pytest on throwaway SQLite (no PostgreSQL)
#   backend-postgres  PostgreSQL 17 -> RLS tests (must execute) -> full backend suite
#   security          repository hygiene (secrets / private runtime files) + npm advisories (report only)
#   ci-success        single required check: fails unless every job above succeeded
#
# CI references no repository or environment secrets. The PostgreSQL credentials are generated per run, masked,
# and exist only inside the backend-postgres job and its throwaway container.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR / branch. Superseded runs are cancelled, except on main, where every merged commit keeps a
  # complete CI record (the Deploy workflow only ever releases a commit whose CI run succeeded).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing command in a pipeline fails the step

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Public, browser-visible configuration only; it is compiled into the client bundle.
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      # `next lint` is not run: the project has no ESLint configuration yet and the command would prompt to set
      # one up. Add a lint step here once a lint configuration is committed.
      - name: Production build (next build)
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-build"
          npm run build 2>&1 | tee "$RUNNER_TEMP/frontend-build/next-build.log"

      - name: Collect build metadata
        run: |
          out="$RUNNER_TEMP/frontend-build"
          # Route and chunk manifests only. Never prerender-manifest.json (it holds Next.js preview-mode signing
          # keys), required-server-files.json or server bundles.
          cp .next/BUILD_ID .next/app-path-routes-manifest.json .next/build-manifest.json "$out/"
          node -e '
            const fs = require("fs");
            console.log(JSON.stringify({
              commit: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, run_id: process.env.GITHUB_RUN_ID,
              node: process.version, next: require("next/package.json").version,
              build_id: fs.readFileSync(".next/BUILD_ID", "utf8").trim(),
              next_public_api_url: process.env.NEXT_PUBLIC_API_URL,
            }, null, 2));' > "$out/build-metadata.json"
          cat "$out/build-metadata.json"

      - name: Upload build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build-metadata
          path: ${{ runner.temp }}/frontend-build/
          retention-days: 14
          if-no-files-found: error

  backend-unit:
    name: backend-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ZA_SKIP_DOTENV: "1"  # never read a backend/.env (none is committed; this makes it explicit)
      ZA_DEMO_MODE: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create isolated virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency (pip check)
        run: python -m pip check

      # Everything that does not need PostgreSQL: pure engine tests plus the API suite on a throwaway SQLite
      # database created by tests/conftest.py. PostgreSQL-only tests skip here and must run in backend-postgres.
      - name: Backend tests (no PostgreSQL)
        id: tests
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python -m pytest tests -ra --tb=short -p no:cacheprovider --junitxml="$RUNNER_TEMP/reports/backend-unit.xml"

      - name: Test gate
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: >-
          python ../.github/scripts/junit_gate.py
          --report "$RUNNER_TEMP/reports/backend-unit.xml"
          --label "Backend unit (no PostgreSQL)"
          --allow-skip-reason PostgreSQL-only
          --summary-json "$RUNNER_TEMP/reports/backend-unit-summary.json"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-unit-reports
          path: ${{ runner.temp }}/reports/
          retention-days: 14
          if-no-files-found: warn

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ZA_SKIP_DOTENV: "1"
      # Platform setting for this job. tests/conftest.py opts its own pytest process into the synthetic Customer
      # Zero fixture, which is seeded only into the disposable databases created below.
      ZA_DEMO_MODE: "0"
      PG_IMAGE: postgres:17
      PG_CONTAINER: za-ci-postgres
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create isolated virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency (pip check)
        run: python -m pip check

      - name: Record resolved dependency set
        run: |
          mkdir -p "$RUNNER_TEMP/lock"
          python -m pip freeze > "$RUNNER_TEMP/lock/backend-requirements.lock.txt"

      # A container started here rather than a `services:` container: service containers take their environment
      # when the job starts, so they cannot receive a password generated inside the run. This one listens on the
      # runner's loopback only and is removed at the end of the job.
      - name: Start PostgreSQL 17 (disposable)
        run: |
          superuser_pw="$(openssl rand -hex 32)"
          echo "::add-mask::$superuser_pw"
          # Only the container receives the superuser password. It is never written to GITHUB_ENV, so the backend
          # and the tests cannot see it.
          POSTGRES_PASSWORD="$superuser_pw" docker run --detach --name "$PG_CONTAINER" \
            --env POSTGRES_PASSWORD \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres" \
            --health-interval 2s --health-timeout 5s --health-retries 45 \
            "$PG_IMAGE" > /dev/null
          status=starting
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$PG_CONTAINER")"
            if [ "$status" = healthy ] || [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            echo "::error title=PostgreSQL::the service did not become healthy (status: $status)"
            docker logs --tail 50 "$PG_CONTAINER" || true
            exit 1
          fi
          docker exec "$PG_CONTAINER" postgres --version

      - name: Provision disposable test roles and databases
        run: |
          owner_pw="$(openssl rand -hex 32)"
          app_pw="$(openssl rand -hex 32)"
          echo "::add-mask::$owner_pw"
          echo "::add-mask::$app_pw"
          # Runs as the container's superuser over its local socket. The owner password reaches psql through an
          # environment variable, never a command line, and the SQL file never echoes it.
          ZA_CI_OWNER_PASSWORD="$owner_pw" docker exec -i --env ZA_CI_OWNER_PASSWORD "$PG_CONTAINER" \
            psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$GITHUB_WORKSPACE/.github/scripts/ci_postgres_bootstrap.sql"
          # The variables tests/conftest.py reads. The runtime role assure_app is created by the backend's own
          # bootstrap with app_pw, as in a real start-up.
          host="127.0.0.1:5432"
          {
            echo "ZA_TEST_DATABASE_ADMIN_URL=postgresql+psycopg://assure:${owner_pw}@${host}/assure_test"
            echo "ZA_TEST_DATABASE_URL=postgresql+psycopg://assure_app:${app_pw}@${host}/assure_test"
            echo "ZA_RLS_TEST_DATABASE_ADMIN_URL=postgresql+psycopg://assure:${owner_pw}@${host}/assure_test_rls"
            echo "ZA_RLS_TEST_DATABASE_URL=postgresql+psycopg://assure_app:${app_pw}@${host}/assure_test_rls"
          } >> "$GITHUB_ENV"

      # tests/conftest.py silently falls back to SQLite when ZA_TEST_DATABASE_URL is missing. Refuse that here, and
      # prove the server really is PostgreSQL 17 and the owner role is not a superuser.
      - name: Verify PostgreSQL 17 is reachable
        run: |
          python - <<'PY'
          import os
          import sys
          from sqlalchemy import create_engine, text

          names = ("ZA_TEST_DATABASE_URL", "ZA_TEST_DATABASE_ADMIN_URL",
                   "ZA_RLS_TEST_DATABASE_URL", "ZA_RLS_TEST_DATABASE_ADMIN_URL")
          for name in names:
              if not os.environ.get(name, "").startswith("postgresql+psycopg://"):
                  sys.exit(f"{name} is not a PostgreSQL URL; refusing to let the tests fall back to SQLite")
          for name in ("ZA_RLS_TEST_DATABASE_ADMIN_URL", "ZA_TEST_DATABASE_ADMIN_URL"):
              engine = create_engine(os.environ[name])
              with engine.connect() as conn:
                  version = int(conn.execute(text("SHOW server_version_num")).scalar())
                  db, user, superuser = conn.execute(text(
                      "SELECT current_database(), current_user, rolsuper FROM pg_roles WHERE rolname = current_user")).one()
              engine.dispose()
              if not 170000 <= version < 180000:
                  sys.exit(f"expected PostgreSQL 17, found server_version_num {version}")
              if superuser:
                  sys.exit("the test owner role must not be a superuser")
              print(f"{db}: PostgreSQL {version} reachable as {user} (NOSUPERUSER)")
          PY

      # Dedicated, fail-fast RLS proof on its own fresh database. pytest exits 0 when tests skip, so the gate below
      # is what fails the job if the RLS tests did not actually execute.
      - name: RLS tests (tests/test_rls.py must execute)
        id: rls
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          ZA_TEST_DATABASE_URL="$ZA_RLS_TEST_DATABASE_URL" \
          ZA_TEST_DATABASE_ADMIN_URL="$ZA_RLS_TEST_DATABASE_ADMIN_URL" \
            python -m pytest tests/test_rls.py -ra --tb=short -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/reports/rls.xml"

      - name: RLS gate (5 tests, none skipped)
        if: ${{ !cancelled() && (steps.rls.outcome == 'success' || steps.rls.outcome == 'failure') }}
        run: >-
          python ../.github/scripts/junit_gate.py
          --report "$RUNNER_TEMP/reports/rls.xml"
          --label "PostgreSQL RLS (tests/test_rls.py)"
          --no-skips
          --require test_rls=5
          --redact-env ZA_RLS_TEST_DATABASE_URL
          --redact-env ZA_RLS_TEST_DATABASE_ADMIN_URL
          --summary-json "$RUNNER_TEMP/reports/rls-summary.json"

      - name: Full backend suite on PostgreSQL 17
        id: full
        run: >-
          python -m pytest tests -ra --tb=short -p no:cacheprovider
          --junitxml="$RUNNER_TEMP/reports/backend-postgres.xml"

      - name: Full-suite gate (no skips, RLS and bootstrap proofs included)
        if: ${{ !cancelled() && (steps.full.outcome == 'success' || steps.full.outcome == 'failure') }}
        run: >-
          python ../.github/scripts/junit_gate.py
          --report "$RUNNER_TEMP/reports/backend-postgres.xml"
          --label "Backend suite on PostgreSQL 17"
          --no-skips
          --require test_rls=5
          --require test_pg_bootstrap=3
          --redact-env ZA_TEST_DATABASE_URL
          --redact-env ZA_TEST_DATABASE_ADMIN_URL
          --summary-json "$RUNNER_TEMP/reports/backend-postgres-summary.json"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-reports
          path: ${{ runner.temp }}/reports/
          retention-days: 14
          if-no-files-found: warn

      # The exact dependency set the PostgreSQL suite passed with; the Deploy workflow packages it into the release.
      - name: Upload dependency lock for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-requirements-lock
          path: ${{ runner.temp }}/lock/backend-requirements.lock.txt
          retention-days: 30
          if-no-files-found: error

      - name: Remove PostgreSQL container
        if: ${{ always() }}
        run: docker rm --force --volumes "$PG_CONTAINER" > /dev/null 2>&1 || true

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository hygiene (env files, keys, secrets, databases, backend/var)
        run: python3 .github/scripts/repo_hygiene.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Report only. The current tree has known next/postcss advisories whose fix is a semver-major Next.js upgrade
      # that needs a decision; making this blocking now would turn every run red. See docs/ci-cd.md.
      - name: Frontend dependency advisories (npm audit, non-blocking)
        working-directory: frontend
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          npm audit --package-lock-only --json > "$RUNNER_TEMP/security/npm-audit.json" || true
          python3 - "$RUNNER_TEMP/security/npm-audit.json" <<'PY'
          import json
          import os
          import sys

          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError) as e:
              print(f"::warning title=npm audit::no audit result ({type(e).__name__}); the registry may be unreachable")
              sys.exit(0)
          counts = data.get("metadata", {}).get("vulnerabilities", {})
          lines = ["### Frontend dependency advisories (npm audit, non-blocking)", "",
                   "counts: " + ", ".join(f"{k} {v}" for k, v in counts.items()), ""]
          for name, v in sorted(data.get("vulnerabilities", {}).items()):
              fix = v.get("fixAvailable")
              if isinstance(fix, dict):
                  fix = f"{fix.get('name')}@{fix.get('version')}" + (" (semver-major)" if fix.get("isSemVerMajor") else "")
              lines.append(f"- `{name}`: {v.get('severity')}, direct dependency: {v.get('isDirect')}, fix: {fix}")
          text = "\n".join(lines)
          print(text)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(text + "\n\n")
          if counts.get("total"):
              print(f"::warning title=npm audit (non-blocking)::{counts['total']} advisory(ies); see the job summary")
          PY

      - name: Upload advisory report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-advisories
          path: ${{ runner.temp }}/security/
          retention-days: 14
          if-no-files-found: warn

  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [frontend, backend-unit, backend-postgres, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
